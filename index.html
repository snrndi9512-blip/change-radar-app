function esc(s){
  return String(s == null ? "" : s)

    .split(">").join("&gt;").split('"').join("&quot;");
}
function won(v){
  if (v == null) return "-";
  const a = Math.abs(v);
  if (a >= 1e12) return (v / 1e12).toFixed(2) + "조원";
  if (a >= 1e8) return Math.round(v / 1e8).toLocaleString("ko-KR") + "억원";
  return v.toLocaleString("ko-KR") + "원";
}

    '<div class="row">' +
      '<div class="chip"><div class="n up">' + evCount + '</div><div class="c">새 변화</div></div>' +
      '<div class="chip"><div class="n" style="color:var(--warn)">' + bad + '</div><div class="c">주의 신호</div></div>' +
      '<div class="chip"><div class="n down">' + cooled + '</div><div class="c">여론 악화</div></div>' +
    '</div></div>';
}

/* ── 오늘 왜 움직였나 ── */
function whyBlock(s){
  if (!s.why || !s.why.text) return "";
  const tags = (s.why.sources || []).map(function(x){
    return '<span class="t">' + esc(x) + '</span>'; }).join("");
  return '<div class="why"><div class="q">💡 오늘 왜 움직였나?</div>' +
         '<p>' + esc(s.why.text) + '</p>' +
         '<div class="srcs">' + tags + '</div></div>';
}

/* ── 지난 분기 대비 달라진 점 ── */
function diffBlock(f){
  if (!f) return "";
  const rows = f.rows.map(function(r){
    const vals = r.kind === "ratio"
      ? r.prev.toFixed(1) + "% → <b>" + r.cur.toFixed(1) + "%</b>"
      : won(r.prev) + " → <b>" + won(r.cur) + "</b>";
    return '<div class="drow">' +
             '<div class="m">' + esc(r.name) + '</div>' +
             '<div class="vals">' + vals + '</div>' +
             '<div class="tag ' + r.tag + '">' + esc(r.tag_text) + '</div>' +
           '</div>';
  }).join("");
  return '<div class="diff">' +
    '<div class="dh"><b>' + f.year + '년 ' + f.quarter + '분기</b>' +
      '<span>지난 분기 → 이번 분기</span></div>' + rows +
    '<div class="dfoot">' + esc(f.basis) + ' · ' + esc(f.fs) +
      ' · 정기보고서 재무제표 기준 (잠정실적 공시의 숫자와 다를 수 있습니다)</div>' +
  '</div>';
}

/* ── 투자자 기준 대조 (추천이 아니라 대조) ── */
function investorBlock(list){
  if (!list || !list.length) return "";
  return list.map(function(iv){
    const ratio = iv.passed / iv.total;
    const c = ratio === 1 ? "good" : (ratio >= 0.5 ? "neu" : "bad");
    const rows = iv.checks.map(function(ch){
      const mk = ch.pass
        ? '<span class="mk" style="color:var(--good)">✓</span>'
        : '<span class="mk" style="color:var(--bad)">✕</span>';
      return '<div class="inv-row">' + mk +
        '<div><div class="lb">' + esc(ch.label) + '</div>' +
        '<div class="wh">' + esc(ch.why) + '</div></div>' +
        '<div class="vl">' + ch.value + ch.unit +
          '<small>기준 ' + (ch.op === ">=" ? "≥ " : "≤ ") + ch.target + ch.unit + '</small>' +
        '</div></div>';
    }).join("");
    return '<div class="inv">' +
      '<div class="inv-h"><span class="who">' + iv.emoji +
        ' <b>' + esc(iv.who) + '</b> 기준으로 보면' +
        '</span><span class="cnt tag ' + c + '">' + iv.passed + ' / ' + iv.total + ' 충족</span></div>' +
      '<div class="inv-h" style="border-bottom:1px solid var(--line);padding-top:7px;padding-bottom:7px">' +
        '<span class="src">' + esc(iv.src) + '</span></div>' +
      rows +
      '<div class="inv-foot">이번 분기 숫자만 대조한 결과입니다. 원래 이 기준들은 ' +
      '여러 해에 걸쳐 꾸준한지를 보는 것이라, 한 분기로 회사를 판단할 수는 없습니다. ' +
      '매수·매도 의견이 아닙니다.</div>' +
    '</div>';
  }).join("");
}

/* ── 여론 온도계 ── */
function sentiBlock(s){
  if (s.temp == null) return "";
  const v = s.temp, prev = s.temp_prev;
  let delta = '<span class="delta flat">어제 기록 없음</span>';
  if (prev != null){
    const d = v - prev;
    delta = d > 0
      ? '<span class="delta up">어제보다 ' + d + '도 올랐어요</span>'
      : (d < 0
        ? '<span class="delta down">어제보다 ' + Math.abs(d) + '도 떨어졌어요</span>'
        : '<span class="delta flat">어제와 같아요</span>');
  }
  const ghost = prev == null ? ""
    : '<div class="ghost" style="left:' + prev + '%" title="어제 ' + prev + '도"></div>';
  const note = s.temp_n
    ? '기사 제목 ' + s.temp_n + '건 기준' +
      (s.temp_skipped ? ' · 홍보성 ' + s.temp_skipped + '건 제외' : '') +
      (prev != null ? ' · 흰 선이 어제 위치' : '')
    : "";
  return '<div class="senti">' +
    '<div class="sh"><span>🌡 여론 온도 <b>' + v + '도</b> · ' + tempLabel(v) + '</span>' +
      delta + '</div>' +
    '<div class="bar">' + ghost + '<div class="knob" style="left:' + v + '%"></div></div>' +
    '<div class="scale"><span>1도 차가움</span><span>50 중립</span><span>100도 뜨거움</span></div>' +
    (note ? '<div class="note">' + note + '</div>' : "") +
  '</div>';
}

/* ── 공시 타임라인 ── */
function timeline(events){
  if (!events || !events.length){
    return '<div class="empty">최근 60일간 챙겨볼 만한 공시가 없었어요.</div>';
  }
  const dotOf = {"호재":"g", "악재":"b", "중립":"n", "확인필요":"w"};
  return '<div class="tl">' + events.map(function(e, i){
    const last = i === events.length - 1;
    const sev = e.score >= 85 ? "상" : (e.score >= 75 ? "중" : "하");
    const cls = {"호재":"good", "악재":"bad", "중립":"neu"}[e.judgment] || "hot";
    const sigs = (e.signals || []).map(function(g){
      const mk = g.weight < 0 ? "▼" : (g.weight > 0 ? "▲" : "―");
      const c = g.weight < 0 ? "down" : (g.weight > 0 ? "up" : "flat");
      return '<div class="sig"><div class="mk ' + c + '">' + mk + '</div>' +
             '<div><div class="bs">' + esc(g.basis) + '</div>' +
             '<div class="ft">' + esc(g.fact) + '</div></div></div>';
    }).join("");
    const why = sigs
      ? '<div class="ev-why"><div class="h">이렇게 본 이유</div>' + sigs + '</div>' : "";
    const lines = (e.lines || []).length
      ? '<ul>' + e.lines.map(function(l){ return "<li>" + esc(l) + "</li>"; }).join("") + '</ul>'
      : "";
    return '<div class="item">' +
      '<div class="line"><div class="d ' + (dotOf[e.judgment] || "w") + '"></div>' +
        (last ? "" : '<div class="bar2"></div>') + '</div>' +
      '<div class="ct">' +
        '<div class="dt">' + ymd(e.date) +
          '<span class="bdg ' + cls + '">' + esc(e.judgment) + '</span>' +
          '<span class="bdg neu">중요도 ' + sev + '</span>' +
          (e.repeat > 1 ? '<span class="bdg hot">' + e.repeat + '회 반복</span>' : "") +
        '</div>' +
        '<div class="tx">' + esc(e.title) + '</div>' +
        lines + why +
        '<a href="' + esc(e.link) + '" target="_blank" rel="noopener">DART 원문 보기 →</a>' +
      '</div></div>';
  }).join("") + '</div>';
}

/* ── 접이식 구역 ── */
function sect(title, inner, hint, open){
  if (!inner) return "";
  return '<details class="sect"' + (open ? " open" : "") + '>' +
    '<summary><span class="chev">&#9656;</span>' + esc(title) +
      (hint ? '<span class="hint">' + esc(hint) + '</span>' : "") + '</summary>' +
    '<div class="sect-b">' + inner + '</div></details>';
}

/* ── 종목 카드 ── */
function stockCard(s){
  const cls = s.pct == null ? "flat" : dirClass(s.pct);
  const price = s.pct == null ? ""
    : '<div class="price"><div class="p">' + s.price.toLocaleString("ko-KR") + '</div>' +
      '<div class="ch ' + cls + '">' + (s.pct > 0 ? "+" : "") + s.pct.toFixed(2) + '%</div></div>';

  const badges = [];
  (s.events || []).slice(0, 2).forEach(function(e){
    const c = {"호재":"good", "악재":"bad", "중립":"neu"}[e.judgment] || "hot";
    const b = (e.signals || [])[0];
    badges.push('<span class="bdg ' + c + '">' + esc(b ? b.basis : e.judgment) + '</span>');
  });
  if (s.temp != null && s.temp_prev != null && s.temp < s.temp_prev)
    badges.push('<span class="bdg hot">여론 악화</span>');
  if (s.pct != null && Math.abs(s.pct) >= 3)
    badges.push('<span class="bdg hot">주가 급변</span>');

  const first = (s.events || [])[0];
  const oneline = first
    ? '<div class="oneline"><b>' + esc(first.title) + '</b> — ' + esc(first.reason) + '</div>'
    : '<div class="oneline">최근 챙겨볼 만한 공시는 없었어요.</div>';

  // ── 접힌 상태에서 보이는 부분 ──
  const head =
    '<div class="srow"><div><span class="sname">' + esc(s.name) + '</span>' +
      '<span class="sticker">' + esc(s.code) +
      (s.market ? " · " + esc(s.market) : "") + '</span></div>' + price + '</div>' +
    (badges.length ? '<div class="badges">' + badges.join("") + '</div>' : "") +
    oneline +
    '<div class="more"><span class="chev">&#9656;</span>눌러서 자세히 보기</div>';

  // ── 펼쳤을 때 나오는 부분 ──
  const news = (s.news || []).length
    ? '<div class="news">' + s.news.map(function(n){
        return n.link
          ? '<a href="' + esc(n.link) + '" target="_blank" rel="noopener">' + esc(n.title) + '</a>'
          : '<a>' + esc(n.title) + '</a>';
      }).join("") + '</div>'
    : "";

  const finHint = s.fin ? s.fin.year + "년 " + s.fin.quarter + "분기" : "";
  const invHint = (s.investor || []).map(function(iv){
    return iv.who + " " + iv.passed + "/" + iv.total; }).join(" · ");
  const tempHint = s.temp != null ? s.temp + "도 " + tempLabel(s.temp) : "";
  const evHint = (s.events || []).length ? (s.events.length + "건") : "없음";

  const body =
    whyBlock(s) +
    sect("지난 분기 대비 달라진 점", diffBlock(s.fin), finHint, true) +
    sect("유명 투자자 기준으로 보면", investorBlock(s.investor), invHint) +
    sect("여론 온도", sentiBlock(s), tempHint) +
    sect("공시 타임라인", timeline(s.events), evHint) +
    sect("관련 뉴스", news, (s.news || []).length ? s.news.length + "건" : "");

  return '<details class="stock"><summary class="card">' + head + '</summary>' +
         '<div class="stock-b">' + body + '</div></details>';
}

(function render(){
  const app = document.getElementById("app");
  if (!DATA){ app.innerHTML = '<div class="empty">데이터가 없습니다.</div>'; return; }
  document.getElementById("stamp").textContent =
    (DATA.built || DATA.generated || "") + " 기준";

  let html = hero(DATA);
  html += '<h2 class="sec">📌 관심종목 <span class="pill">눌러서 펼치기</span></h2>';
  (DATA.stocks || []).forEach(function(s){ html += stockCard(s); });
  app.innerHTML = html;
})();
</script>
